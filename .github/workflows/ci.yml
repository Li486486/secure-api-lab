name: Secure API CI/CD Pipeline

# 触发条件：当有代码推送到主分支或创建 Pull Request 时触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scanning:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. 安装项目依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SAST: 运行 Bandit 进行静态代码安全分析
      # Bandit 会扫描 Python 代码中的常见安全问题（如硬编码密码、不安全的加密算法等）
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          # 扫描 app.py 文件，输出 JSON 格式报告，忽略低级别问题(B101)
          bandit -r app.py -f json -o bandit-report.json -x tests -s B101 

      # 5. SCA: 运行 Safety 进行依赖组件漏洞扫描
      # Safety 会检查 requirements.txt 中的包是否存在已知的 CVE 漏洞
      - name: Run Safety (SCA)
        run: |
          pip install safety
          # 检查依赖，生成 JSON 报告
          safety check -r requirements.txt --json > safety-report.json || true

      # 6. 上传安全扫描报告
      # 即使扫描发现了漏洞导致步骤失败，报告也会被保存，方便你下载查看
      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json