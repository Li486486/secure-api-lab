name: Secure API CI/CD Pipeline

# 触发条件：当有代码推送到主分支或创建 Pull Request 时触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scanning:
    # 明确指定使用 ubuntu-24.04（避免默认使用 ubuntu-26.04 导致 Python 版本不可用）
    runs-on: ubuntu-24.04

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境（使用 3.12 确保在 ubuntu-24.04 上可用）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装项目依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SAST: 运行 Bandit 进行静态代码安全分析
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          
          # --- 修改开始 ---
          # 1. 先运行一次控制台模式，直接打印出哪里有问题 (方便你调试)
          echo "=== Starting Bandit Scan (Console Mode) ==="
          bandit -r . -s B101 || true 
          
          # 2. 再运行一次生成 JSON 报告 (用于上传 Artifact)
          echo "=== Generating JSON Report ==="
          bandit -r . -f json -o bandit-report.json -s B101 || true
          # --- 修改结束 ---
      # 5. SCA: 运行 Safety 进行依赖组件漏洞扫描
      - name: Run Safety (SCA)
        run: |
          pip install safety
          safety check -r requirements.txt --json > safety-report.json || true

      # 6. 上传安全扫描报告
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 5